name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ServerEngineerTest.sln

      - name: Build
        run: dotnet build ServerEngineerTest.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ServerEngineerTest.sln --no-build --configuration Release --verbosity normal
